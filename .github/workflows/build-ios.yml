
name: Build Sayo W Jump (iOS)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o Sayo-W-Jump-iOS-Source.zip -d extracted

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: iOS
          build-config: Release
          path: extracted/sayo-w-jump

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Sayo-W-Jump-iOS-2.2091
          path: extracted/sayo-w-jump/output/*.geode
          if-no-files-found: error
          retention-days: 14
